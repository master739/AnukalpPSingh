<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden for Mia Cara</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="dedication">
        <p>Made by Your Batman</p>
        <p>For Mia Cara</p>
    </div>

    <div id="ui-container">
        <h1>Flower Garden</h1>
        <div class="controls">
            <button id="auto-btn">✨ Auto Bloom</button>
            <button id="clear-btn">🧹 Clear</button>
            <div class="wind-box">
                <label>🍃 Wind</label>
                <input type="range" id="wind-slider" min="0.5" max="5" step="0.1" value="2">
            </div>
        </div>
    </div>

    <div id="garden"></div>

    <script src="script.js"></script>
</body>
</html>
